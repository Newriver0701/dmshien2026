<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram Tarot Auto</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f6f7f9;
        color: #1b1f24;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 32px auto;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      button {
        border: 1px solid #c9d1dc;
        background: #ffffff;
        border-radius: 6px;
        padding: 10px 14px;
        cursor: pointer;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 16px;
      }

      section {
        background: #ffffff;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        padding: 16px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-top: 1px solid #eef1f5;
      }

      .item:first-of-type {
        border-top: 0;
      }

      .ok {
        color: #107c41;
        font-weight: 700;
      }

      .bad {
        color: #b42318;
        font-weight: 700;
      }

      .muted {
        color: #667085;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        padding: 10px;
        border-top: 1px solid #eef1f5;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: #667085;
        font-weight: 600;
      }

      code {
        background: #f1f4f8;
        border-radius: 4px;
        padding: 2px 5px;
      }

      @media (max-width: 860px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Instagram Tarot Auto</h1>
          <div class="muted" id="updated">Loading...</div>
        </div>
        <button id="refresh">Refresh</button>
      </header>

      <div class="grid">
        <section>
          <h2>Environment</h2>
          <div id="env"></div>
        </section>

        <section>
          <h2>Stats</h2>
          <div id="stats"></div>
        </section>

        <section>
          <h2>Flows</h2>
          <div id="flows"></div>
        </section>
      </div>

      <section>
        <h2>Recent Events</h2>
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Status</th>
              <th>Media</th>
              <th>Comment</th>
              <th>Choice</th>
              <th>Detail</th>
            </tr>
          </thead>
          <tbody id="events"></tbody>
        </table>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("token");

      document.getElementById("refresh").addEventListener("click", load);
      load();
      setInterval(load, 10000);

      async function load() {
        const url = token ? `/api/status?token=${encodeURIComponent(token)}` : "/api/status";
        const response = await fetch(url);
        if (!response.ok) {
          document.body.innerHTML = "<main><h1>Unauthorized</h1><p>ADMIN_TOKENを設定している場合は、<code>/admin?token=...</code>で開いてください。</p></main>";
          return;
        }

        const data = await response.json();
        render(data);
      }

      function render(data) {
        document.getElementById("updated").textContent = `Updated ${new Date().toLocaleString()}`;

        document.getElementById("env").innerHTML = Object.entries(data.env)
          .map(([key, value]) => row(key, typeof value === "boolean" ? status(value) : value))
          .join("");

        document.getElementById("stats").innerHTML = Object.entries(data.stats)
          .map(([key, value]) => row(key, value))
          .join("");

        document.getElementById("flows").innerHTML = data.flows
          .map((flow) => row(flow.marker, flow.choices.join(", ")))
          .join("");

        document.getElementById("events").innerHTML =
          data.recentEvents
            .map(
              (event) => `
                <tr>
                  <td>${escapeHtml(new Date(event.at).toLocaleString())}</td>
                  <td>${escapeHtml(event.status ?? "")}</td>
                  <td><code>${escapeHtml(event.mediaId ?? "")}</code></td>
                  <td><code>${escapeHtml(event.commentId ?? "")}</code></td>
                  <td>${escapeHtml(event.choice ?? "")}</td>
                  <td>${escapeHtml(event.reason ?? event.message ?? event.marker ?? event.text ?? "")}</td>
                </tr>
              `
            )
            .join("") || `<tr><td colspan="6" class="muted">No events yet</td></tr>`;
      }

      function row(label, value) {
        return `<div class="item"><span>${escapeHtml(label)}</span><span>${value}</span></div>`;
      }

      function status(value) {
        return value ? '<span class="ok">set</span>' : '<span class="bad">missing</span>';
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }
    </script>
  </body>
</html>
